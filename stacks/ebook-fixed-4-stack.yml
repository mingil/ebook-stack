# =============================================================================
# 📚 ULTIMATE SYNOLOGY EBOOK, MANGA, WEBTOON & AUDIOBOOK STACK (ebook-stack v1.3.0)
# =============================================================================
# • 프로젝트명   : ebook-stack (단일 프로젝트 & 단일 docker-compose.yml 통합 아키텍처)
# • 통합 이미지  : kimmingil/ebook-stack:latest (폴더/권한 자동 초기화 · REST API 자동 배선 · 24h DB 닥터)
# • 시놀로지 권한: PUID=1026 / PGID=100 / TZ=Asia/Seoul
# • 설정 경로    : /volume1/docker/<서비스명> (순수 Config & DB 전용 완벽 분리)
# • 마스터 서재  : /volume1/mediarr/ebooks:/ebooks:rw & /volume1/mediarr:/data:rw (Mediarr-Stack 0.1초 하드링크 연동)
# • 기존 호환성  : 기존 Komga(/data), Kavita(/manga), ABS(/audiobooks), Calibre 서재 100% 무손실 승계
# =============================================================================

version: "3.9"

# 🌐 1. 도커 내부 통신용 브리지 네트워크 (기존 ebook_net 100% 호환)
networks:
  ebook_net:
    name: ebook_net
    driver: bridge

# 🧹 2. 시놀로지 NAS 디스크 보호용 공통 로그 로테이션 설정
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # 🎛️ 0. EBOOK CONTROL CENTER - 폴더/권한(1026:100) 초기화 · Zero-Touch API 배선 · 24h DB 닥터
  # ---------------------------------------------------------------------------
  ebook-control-center:
    image: kimmingil/ebook-stack:latest
    container_name: ebook-control-center
    hostname: ebook-control-center
    networks:
      ebook_net:
        aliases:
          - ebook-control-center
          - ebook-stack
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      PORT: 8500
      AUTO_BOOTSTRAP: "true"
      AUTO_DAILY_MAINTENANCE: "true"
      AUTO_MAINTENANCE_INTERVAL_HOURS: "24"
      HOST_DOCKER_MOUNT: /host-docker
      HOST_DATA_MOUNT: /host-data
      NAS_IP: ${NAS_IP:-192.168.0.100}
      KOMGA_USER: ${KOMGA_USER:-admin@example.com}
      KOMGA_PASSWORD: ${KOMGA_PASSWORD:-}
      KAVITA_API_KEY: ${KAVITA_API_KEY:-}
      CONTROL_CENTER_USER: ${CONTROL_CENTER_USER:-admin}
      CONTROL_CENTER_PASSWORD: ${CONTROL_CENTER_PASSWORD:-}
    ports:
      - "8586:8500"
    volumes:
      - /volume1/docker:/host-docker:rw
      - /volume1/mediarr/ebooks:/host-data:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8500/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 📚 1. KOMGA - 만화·웹툰·매거진 메인 미디어 서버 (기존 /data 서재 100% 보존 + G1GC 최적화)
  # ---------------------------------------------------------------------------
  komga:
    image: gotson/komga:latest
    container_name: ebook-komga
    hostname: komga
    networks:
      ebook_net:
        aliases:
          - komga
          - ebook-komga
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: "-Xmx3g -XX:+UseG1GC -XX:+UseStringDeduplication"
      SERVER_PORT: 25600
    ports:
      - "8341:25600"
    volumes:
      - /volume1/docker/komga/config:/config:rw
      - /volume1/docker/komga/data:/data:rw
      - /volume1/mediarr/ebooks:/ebooks:rw
      - /volume1/mediarr/ebooks/calibre-library:/calibre-library:rw
    depends_on:
      ebook-control-center:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:25600/actuator/health >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:25600/actuator/health >/dev/null 2>&1 || bash -c '</dev/tcp/127.0.0.1/25600' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🌟 2. KAVITA - 라이트노벨(EPUB)·소설·만화 초고속 하이브리드 서버 (기존 /manga 서재 보존)
  # ---------------------------------------------------------------------------
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: ebook-kavita
    hostname: kavita
    networks:
      ebook_net:
        aliases:
          - kavita
          - ebook-kavita
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PUID: ${PUID:-1026}
      PGID: ${PGID:-100}
      DOTNET_GCHeapHardLimit: 0xC0000000
    ports:
      - "5471:5000"
    volumes:
      - /volume1/docker/kavita/config:/kavita/config:rw
      - /volume1/docker/kavita/data:/manga:rw
      - /volume1/mediarr/ebooks:/ebooks:rw
      - /volume1/mediarr/ebooks:/data:rw
      - /volume1/mediarr/ebooks/lightnovels:/lightnovels:rw
      - /volume1/mediarr/ebooks/books:/books:rw
      - /volume1/mediarr/ebooks/calibre-library:/calibre-library:rw
    depends_on:
      ebook-control-center:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/api/health >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:5000/api/health >/dev/null 2>&1 || bash -c '</dev/tcp/127.0.0.1/5000' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🎧 3. AUDIOBOOKSHELF - 오디오북·팟캐스트·전자책 스트리밍 서버 (기존 /audiobooks 서재 보존)
  # ---------------------------------------------------------------------------
  audiobookshelf:
    image: advplyr/audiobookshelf:latest
    container_name: ebook-audiobookshelf
    hostname: audiobookshelf
    networks:
      ebook_net:
        aliases:
          - audiobookshelf
          - ebook-audiobookshelf
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 4g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      CONFIG_PATH: /config
      METADATA_PATH: /metadata
      PORT: 80
      JWT_SECRET_KEY: ${ABS_JWT_SECRET:-CHANGE_ME_ABS_JWT_SECRET_KEY}
    ports:
      - "13378:80"
    volumes:
      # ✅ [핵심 수정 완료] 기존 상위 폴더(/volume1/docker/audiobookshelf) 중첩 마운트 버그를 /config 하위 분리로 해결
      - /volume1/docker/audiobookshelf/config:/config:rw
      - /volume1/docker/audiobookshelf/metadata:/metadata:rw
      - /volume1/docker/audiobookshelf/audiobooks:/audiobooks:rw
      - /volume1/mediarr/ebooks:/ebooks:rw
      - /volume1/mediarr/ebooks/podcasts:/podcasts:rw
      - /volume1/mediarr/ebooks/books:/books:rw
      - /volume1/mediarr/ebooks/lightnovels:/lightnovels:rw
      - /volume1/mediarr/ebooks/calibre-library:/calibre-library:rw
    depends_on:
      ebook-control-center:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:80/ping >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: on-failure:5
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 🤖 4. KOMF - Komga & Kavita 만화·웹툰·라노벨 메타데이터 자동 수집 엔진
  # ---------------------------------------------------------------------------
  komf:
    image: sndxr/komf:latest
    container_name: ebook-komf
    hostname: komf
    networks:
      ebook_net:
        aliases:
          - komf
          - ebook-komf
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.depends-on: "komga,kavita"
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-1026}:${PGID:-100}"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      KOMF_KOMGA_BASE_URI: http://komga:25600
      KOMF_KOMGA_USER: ${KOMGA_USER}
      KOMF_KOMGA_PASSWORD: ${KOMGA_PASSWORD}
      KOMF_KAVITA_BASE_URI: http://kavita:5000
      KOMF_KAVITA_API_KEY: ${KAVITA_API_KEY}
      KOMF_LOG_LEVEL: INFO
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+UnlockExperimentalVMOptions -XX:+UseShenandoahGC -XX:ShenandoahGCHeuristics=compact -XX:ShenandoahGuaranteedGCInterval=3600000 -XX:TrimNativeHeapInterval=3600000"
    ports:
      - "8085:8085"
    volumes:
      - /volume1/docker/komf/config:/config:rw
    depends_on:
      ebook-control-center:
        condition: service_healthy
      komga:
        condition: service_healthy
      kavita:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085 >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:8085 >/dev/null 2>&1 || bash -c '</dev/tcp/127.0.0.1/8085' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure:5
    logging: *default-logging
